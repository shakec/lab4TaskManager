<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <title>Task Manager</title>
</head>
<body>
    <main id="card">
        <section id="header-section">
            <h1>Task Manager</h1>
        </section>

        <section id="form-section">
            <h2>Add a New Task</h2>
        
            <form action="" id="task-form">

                <label for="task-name">Task Name</label>
                <input type="text" id="task-name" name="task-name" placeholder="Enter the task name">

                <label for="category">Category</label>
                <input type="text" id="category" name="category" placeholder="Enter the category">

                <label for="deadline">Deadline</label>
                <input type="text" id="deadline" name="deadline" placeholder="Enter the deadline">

                <!-- Update to a dropdown -->
                <label for="task-status">Status</label>
                <select name="" id="task-status">
                    <option value="Not Started">
                        Not Started
                    </option>
                    <option value="In Progress">
                        In Progress
                    </option>
                    <option value="Completed">
                        Completed
                    </option>
                </select>

                <button type="submit">Add Task</button>

            </form>
        </section>
        
    </main>
</body>
</html>
