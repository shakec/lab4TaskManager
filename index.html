<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <title>Task Manager</title>
</head>
<body>
    <main id="card">
        <section id="header-section">
            <h1>Task Manager</h1>
        </section>

        <label for="task-name">Task Name</label>
        <input type="text" id="task-name" name="task-name" placeholder="Enter the task name">

        <label for="category">Category</label>
        <input type="text" id="category" name="category" placeholder="Enter the category">

        <label for="deadline">Deadline</label>
        <input type="text" id="deadline" name="deadline" placeholder="Enter the deadline">

        <label for="status">Status</label>
        <input type="text" id="status" name="status" placeholder="Enter the status">

        <button id="add-task">Add Task</button>
    </main>
</body>
</html>
